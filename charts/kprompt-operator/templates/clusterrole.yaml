{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kprompt-operator.fullname" . }}
  labels:
    {{- include "kprompt-operator.labels" . | nindent 4 }}
rules:
  # KpromptAgent CRs
  - apiGroups: ["kprompt.ai"]
    resources: ["kpromptagents", "kpromptagents/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Observe agent lifecycle objects (per watch namespace)
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kprompt-operator.fullname" . }}
  labels:
    {{- include "kprompt-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kprompt-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kprompt-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
