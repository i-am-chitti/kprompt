apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kprompt-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kprompt-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kprompt-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kprompt-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "kprompt-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "kprompt-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - agent
            - operator
            - --in-cluster
            {{- if .Values.watchNamespace }}
            - --namespace
            - {{ .Values.watchNamespace | quote }}
            {{- end }}
            {{- if .Values.defaultAgentImage }}
            - --default-image
            - {{ .Values.defaultAgentImage | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
