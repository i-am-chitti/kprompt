{{- if .Values.rbac.clusterRole.create -}}
# Optional / reserved (AG-039). Default install leaves this off.
# Even when enabled, verbs stay get/list on namespaces only — never Secrets or mutate.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kprompt-coordinator.fullname" . }}
  labels:
    {{- include "kprompt-coordinator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kprompt-coordinator.fullname" . }}
  labels:
    {{- include "kprompt-coordinator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kprompt-coordinator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kprompt-coordinator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
