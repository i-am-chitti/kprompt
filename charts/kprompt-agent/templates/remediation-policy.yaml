{{- if include "kprompt-agent.remediationPolicyEnabled" . -}}
{{- $policyAuto := eq (include "kprompt-agent.autopilotPolicyAuto" . | trim) "true" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kprompt-remediation-policy
  namespace: {{ include "kprompt-agent.watchNamespace" . }}
  labels:
    {{- include "kprompt-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: remediation-policy
data:
  policy.json: |
    {
      "apiVersion": "kprompt.io/v1",
      "kind": "RemediationPolicy",
      "schemaVersion": "1",
      "allow": {{ .Values.agent.autopilotAllow | default (list "rollbackFailedRollout") | toJson }},
      "mode": {{ if $policyAuto }}"policyAuto"{{ else }}"proposeOnly"{{ end }},
      "apply": {{ $policyAuto }},
      "minConfidence": {{ .Values.agent.autopilotMinConfidence | default "0.85" }}
    }
{{- end }}
