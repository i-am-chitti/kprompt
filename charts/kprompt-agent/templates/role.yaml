{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kprompt-agent.fullname" . }}
  namespace: {{ include "kprompt-agent.watchNamespace" . }}
  labels:
    {{- include "kprompt-agent.labels" . | nindent 4 }}
rules:
  # Observe Mode — read/watch only (ADR-0013). No create/update/patch/delete.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps", "services", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  {{- if eq (.Values.agent.memoryBackend | default "file") "configmap" }}
  # Namespace memory ConfigMap (AG-015) — facts only; not a control-plane upload.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kprompt-namespace-memory"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  {{- end }}
  {{- if eq (.Values.agent.incidentsBackend | default "") "configmap" }}
  # Durable incident state (AG-032).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kprompt-incident-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  {{- end }}
  {{- if .Values.agentCR.name }}
  # Status-only write on the opted-in KpromptAgent (AG-013). No workload mutate.
  - apiGroups: ["kprompt.ai"]
    resources: ["kpromptagents", "kpromptagents/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  {{- end }}
{{- end }}
