{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kprompt-agent.secretName" . }}
  namespace: {{ include "kprompt-agent.watchNamespace" . }}
  labels:
    {{- include "kprompt-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secret.stringData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
